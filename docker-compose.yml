services:
  ddx:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - WS_TOKEN_SECRET=${WS_TOKEN_SECRET:-}
      - SPECIALIST_CONTEXT_MODE=${SPECIALIST_CONTEXT_MODE:-prior_rounds}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - MOCK_LLM=${MOCK_LLM:-}
      - DB_PATH=/app/data/jobs.sqlite
      - TOOL_CACHE_DB_PATH=/app/data/tool-cache.sqlite
      - ORPHADATA_DB_PATH=/app/data/orphadata.sqlite
    volumes:
      - data:/app/data
    restart: unless-stopped

volumes:
  data:
